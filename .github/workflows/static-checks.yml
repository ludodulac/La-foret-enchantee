name: Static checks

on:
  pull_request:
  push:
    branches:
      - main
      - redesign/premium-media-library

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js data/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Run Studio export integration tests
        run: node tests/studio-export-core.test.cjs
      - name: Check required surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f audio.html
          test -f admin.html
          test -f login.html
          test -f blog.html
          test -f article.html
          test -f css/blog-2026.css
          test -f css/visual-polish.css
          test -f css/advanced-parent-polish.css
          test -f js/app-accessibility.js
          test -f js/child-shell.js
          test -f js/child-controls.js
          test -f js/child-ui-polish.js
          test -f js/profile-advanced-settings.js
          test -f js/admin-blog-safety.js
          test -f supabase/migrations/20260904_unify_admin_permissions.sql
          test -f supabase/migrations/20260904_add_fk_indexes.sql
          test -f supabase/migrations/20260904_optimize_article_select_policies.sql
      - name: Check public page contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="main-content"' index.html
          grep -q 'id="mini-player"' index.html
          grep -q 'js/app-accessibility.js' index.html
          grep -q 'id="blog-grid"' blog.html
          grep -q 'id="blog-filters"' blog.html
          grep -q 'id="article-content"' article.html
          grep -q 'id="article-bc-title"' article.html
          grep -q 'js/blog.js' blog.html
          grep -q 'js/blog.js' article.html
      - name: Check child experience contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="profile-gate"' index.html
          grep -q 'id="parent-space"' index.html
          grep -q 'id="setting-birth-year"' index.html
          grep -q 'id="setting-age-level"' index.html
          grep -q 'id="setting-night-start"' index.html
          grep -q 'id="setting-night-end"' index.html
          grep -q 'id="setting-night-days"' index.html
          grep -q 'id="blocked-title-list"' index.html
          grep -q 'js/profile-advanced-settings.js' index.html
          grep -q 'js/child-controls.js' index.html
          grep -q 'js/child-ui-polish.js' index.html
          grep -q 'js/child-controls.js' audio.html
          grep -q 'renderChildCategories' js/child-shell.js
          grep -q 'renderChildSearch' js/child-shell.js
          grep -q 'blockedAudioIds' js/child-controls.js
          grep -q 'nightModeActive' js/child-controls.js
          grep -q 'profileAgeLimit' js/child-controls.js
          grep -q 'placeStatusInHeader' js/child-ui-polish.js
          grep -q 'window.scrollTo' js/app-resilience.js
          grep -q 'child-symbolic-hero' css/advanced-parent-polish.css
      - name: Check admin auth orchestration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'adminSessionPromise' js/auth.js
          grep -q 'admin-auth-pending' js/auth.js
          grep -q "js/admin-blog-safety.js" js/auth.js
      - name: Check Supabase project consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'jwyayfkssyagvnablttg' js/supabase.js
