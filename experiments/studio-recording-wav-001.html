<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio — essai WAV durable (non intégré)</title>
<style>body{font:17px system-ui,sans-serif;max-width:700px;margin:2em auto;padding:0 1em;background:#151d35;color:#fff}button,input{font:inherit;padding:.65em;margin:.3em}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#273455;padding:1em}.alert{color:#ffdb8a}</style>
<h1>Test isolé : enregistrer une prise WAV</h1>
<p class="alert">Prototype NON intégré à Studio. Une prise est composée de petits WAV locaux, conservés même si la page se ferme. Ne remplace pas encore ton enregistreur. Teste uniquement avec une prise sans valeur.</p>
<p><button id="start">● ENREGISTRER</button><button id="stop" disabled>■ ARRÊTER</button> <button id="recover">RETROUVER LA PRISE</button> <button id="export" disabled>EXPORTER UN WAV</button></p>
<p><button id="find">AFFICHER MES PRISES</button> <select id="saved" aria-label="Prises sauvegardées"><option value="">Aucune prise sélectionnée</option></select></p>
<p>ID de la prise : <input id="takeid" placeholder="automatique" aria-label="ID de la prise" autocomplete="off"></p><p id="status" role="status">Prêt.</p><pre id="log"></pre>
<script src="../js/studio-recording-wav-core.js"></script><script>
(async()=>{
'use strict';const $=s=>document.querySelector(s),C=window.StudioRecordingWavCore;let ctx=null,stream=null,node=null,gain=null,lock=null,take=null,recovered=null,writeChain=Promise.resolve(),pending=0,seq=0,stopping=false,failed=null,stoppedResolve=null;
const log=s=>{$('#status').textContent=s;$('#log').textContent=new Date().toLocaleTimeString()+' '+s+'\n'+$('#log').textContent};
const root=async()=>{if(!navigator.storage?.getDirectory)throw Error('OPFS absent sur ce navigateur');return navigator.storage.getDirectory()};
async function release(){try{node?.disconnect()}catch{}try{gain?.disconnect()}catch{}try{stream?.getTracks().forEach(t=>t.stop())}catch{}try{await ctx?.close()}catch{}try{await lock?.release()}catch{}node=null;gain=null;stream=null;ctx=null;lock=null}
async function stop(){if(stopping||!node)return;stopping=true;$('#stop').disabled=true;log('Arrêt du micro et validation des segments…');try{await new Promise((resolve,reject)=>{stoppedResolve=resolve;node.port.postMessage({type:'stop'});setTimeout(()=>reject(Error('Le Worklet ne répond pas : segments déjà écrits récupérables')),5000)});await writeChain;if(failed)throw failed;log('Prise conservée : '+seq+' segments.');await recover()}catch(e){log('ERREUR : '+e.message+' — segments déjà écrits conservés')}finally{await release();$('#start').disabled=false;stopping=false}}
async function recover(){try{const id=$('#takeid').value.trim();const r=await C.recoverTake(await root(),id);recovered=r;$('#export').disabled=r.interrupted||r.segments===0;log('Récupération : '+r.segments+' fragments WAV, '+r.seconds.toFixed(2)+' secondes. '+(r.interrupted?'Attention : '+r.problem:'Séquence continue.'));return r}catch(e){recovered=null;$('#export').disabled=true;log('Récupération impossible : '+e.message)}}
async function listSaved(){try{const items=await C.listTakes(await root());const select=$('#saved'),selected=select.value;select.replaceChildren(new Option(items.length?'Choisir une prise ('+items.length+')':'Aucune prise trouvée',''));for(const item of items)select.add(new Option(item.id+(item.readable?'':' (métadonnées illisibles)'),item.id));if(items.some(x=>x.id===selected))select.value=selected;if(!$('#takeid').value.trim()&&items[0])$('#takeid').value=items[0].id;log(items.length+' prise(s) locale(s) retrouvée(s). Aucune donnée supprimée.');return items}catch(e){log('Liste impossible : '+e.message);return[]}}
$('#start').onclick=async()=>{if(ctx)return;$('#start').disabled=true;failed=null;pending=0;seq=0;writeChain=Promise.resolve();recovered=null;$('#export').disabled=true;try{ctx=new AudioContext();await ctx.audioWorklet.addModule('../js/studio-recording-wav-worklet.js');stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});await ctx.resume();const id='rec-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);take=await C.createTake(await root(),{id,sampleRate:ctx.sampleRate});$('#takeid').value=id;node=new AudioWorkletNode(ctx,'studio-recording-wav',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1]});gain=ctx.createGain();gain.gain.value=0;ctx.createMediaStreamSource(stream).connect(node);node.connect(gain).connect(ctx.destination);node.port.onmessage=e=>{if(e.data?.type==='stopped'){stoppedResolve?.();return}if(e.data?.type!=='pcm')return;if(failed)return;const pcm=new Uint8Array(e.data.bytes),index=seq++;pending++;if(pending>5){failed=Error('Stockage trop lent : arrêt de sécurité. Les fragments déjà écrits restent disponibles.');log(failed.message);stop();return}writeChain=writeChain.then(async()=>{if(failed)return;await C.appendChunk(take,index,pcm);log('Fragments sur disque : '+(index+1))}).catch(e=>{failed=e;log('Erreur stockage : '+e.message);stop()}).finally(()=>pending--)};try{lock=await navigator.wakeLock?.request('screen')}catch{log('Veille écran : autorisation non disponible')};$('#stop').disabled=false;log('Microphone actif, WAV mono '+ctx.sampleRate+' Hz. Données écrites chaque seconde.')}catch(e){log('Enregistrement impossible : '+e.message);await release();$('#start').disabled=false}}
$('#find').onclick=listSaved;$('#saved').onchange=()=>{if(!ctx&&$('#saved').value){$('#takeid').value=$('#saved').value;recover()}};
$('#stop').onclick=stop;$('#recover').onclick=recover;$('#export').onclick=async()=>{if(!recovered)return;try{if(typeof showSaveFilePicker!=='function')throw Error('Téléchargement direct non disponible ici. Fonction à intégrer à Studio pour Android. Les segments sont toujours conservés.');const fh=await showSaveFilePicker({suggestedName:$('#takeid').value+'.wav',types:[{description:'Audio WAV',accept:{'audio/wav':['.wav']}}]});await C.exportToWritable(recovered,await fh.createWritable());log('WAV enregistré dans tes fichiers.')}catch(e){log('Export : '+e.message)}};
listSaved();
addEventListener('pagehide',()=>{if(ctx&&!stopping){node?.port.postMessage({type:'stop'});stream?.getTracks().forEach(t=>t.stop())}});
})();
</script></html>
