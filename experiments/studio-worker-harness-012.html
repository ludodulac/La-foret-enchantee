<!doctype html><meta charset="utf-8"><script>
window.run012=async function(blob,phaseMs=30000){const stages=[];let workerTerminated=false;const w=new Worker('studio-worker-012.js');const result=await new Promise((resolve,reject)=>{let timer;const arm=stage=>{clearTimeout(timer);timer=setTimeout(()=>reject(Error('PHASE_TIMEOUT = '+stage)),phaseMs)};arm('WORKER_CREATED');w.onmessage=e=>{const d=e.data;if(d.kind==='stage'){stages.push(d);arm(d.stage);return}if(d.kind==='fatal'){clearTimeout(timer);return reject(Error(d.error))}if(d.kind==='result'){clearTimeout(timer);stages.push({kind:'stage',stage:'RESULT_RECEIVED_BY_MAIN'});return resolve(d)}};w.onerror=e=>{clearTimeout(timer);reject(Error(e.message||'WORKER_ERROR'))};w.onmessageerror=()=>{clearTimeout(timer);reject(Error('WORKER_MESSAGE_ERROR'))};w.postMessage({blob})});w.terminate();workerTerminated=true;stages.push({kind:'stage',stage:'WORKER_TERMINATED'});return{...result,stages,workerTerminated};}
</script>
