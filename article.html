<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09100d">
  <title>Article — Ludodio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/blog-2026.css">
</head>
<body class="blog-app">
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">Ludodio</a>
      <nav class="header-nav" aria-label="Navigation du journal">
        <a href="index.html" class="nav-link">Médiathèque</a>
        <a href="blog.html" class="nav-link active">Journal</a>
        <a href="login.html" class="nav-link">Administration</a>
      </nav>
    </div>
  </header>

  <div class="pdf-action-bar" id="pdf-bar">
    <div class="pdf-action-inner">
      <span class="pdf-action-label">Enregistrer cet article</span>
      <button class="btn-pdf" type="button" onclick="downloadPDF()">Télécharger en PDF</button>
    </div>
  </div>

  <main class="article-page" id="article-container">
    <div class="breadcrumb">
      <a href="index.html" class="bc-link">Accueil</a>
      <span class="bc-sep">›</span>
      <a href="blog.html" class="bc-link">Journal</a>
      <span class="bc-sep">›</span>
      <span class="bc-item active" id="article-bc-title">Article</span>
    </div>

    <button class="btn-back" type="button" onclick="history.back()">← Retour</button>
    <div class="pdf-header" id="pdf-header">Ludodio</div>
    <div id="article-content" aria-live="polite"><p class="empty-msg">Chargement…</p></div>
  </main>

  <footer class="site-footer"><p>Ludodio · médiathèque et journal</p></footer>

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/blog.js"></script>
  <script>
    function downloadPDF() {
      const btn = document.querySelector('.btn-pdf');
      btn.textContent = 'Génération…';
      btn.disabled = true;

      const titre = document.getElementById('article-bc-title')?.textContent ?? 'article';
      const nomFichier = titre
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 50) || 'article';

      const source = document.getElementById('article-content');
      const clone = source.cloneNode(true);
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'font-family:Georgia,serif;font-size:13px;line-height:1.8;color:#1a1a1a;padding:0 8px;max-width:680px;';

      const header = document.createElement('div');
      header.style.cssText = 'font-size:11px;color:#888;border-bottom:1px solid #ddd;padding-bottom:8px;margin-bottom:20px;font-family:sans-serif;';
      header.textContent = 'Ludodio';
      wrapper.appendChild(header);
      wrapper.appendChild(clone);

      wrapper.querySelectorAll('h1,h2,h3').forEach(el => {
        el.style.color = '#1a1a1a';
        el.style.fontFamily = 'Georgia,serif';
        el.style.textShadow = 'none';
      });
      wrapper.querySelectorAll('p,li,span').forEach(el => { el.style.color = '#2a2a2a'; });
      wrapper.querySelectorAll('blockquote').forEach(el => {
        el.style.cssText = 'border-left:3px solid #888;padding:6px 12px;background:#f9f9f9;color:#333;margin:12px 0;';
      });
      wrapper.querySelectorAll('a').forEach(el => { el.style.color = '#0055aa'; });
      wrapper.querySelectorAll('iframe,.ql-video').forEach(el => {
        const note = document.createElement('p');
        note.style.cssText = 'color:#888;font-style:italic;font-size:11px;';
        note.textContent = '[Vidéo disponible en ligne]';
        el.replaceWith(note);
      });
      wrapper.querySelectorAll('img').forEach(el => {
        el.style.maxWidth = '100%';
        el.style.borderRadius = '4px';
        el.style.margin = '10px 0';
      });
      wrapper.querySelectorAll('.blog-tag').forEach(el => {
        el.style.cssText = 'display:inline-block;background:#f0f0f0;color:#333;border:1px solid #ccc;border-radius:4px;padding:2px 8px;font-size:10px;margin-bottom:8px;';
      });

      const options = {
        margin: [12, 14, 12, 14],
        filename: nomFichier + '.pdf',
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['avoid-all', 'css'] },
      };

      html2pdf().set(options).from(wrapper).save().then(() => {
        btn.textContent = 'Télécharger en PDF';
        btn.disabled = false;
      }).catch(() => {
        btn.textContent = 'Télécharger en PDF';
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
