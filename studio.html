async function ensureProjectAudio(c,projectId){if(c.audio_path)return c.audio_path;let path=projectId+'/'+c.id+'.wav',blob=wav(c.buffer),up=await dbClient.storage.from('studio-projects').upload(path,blob,{contentType:'audio/wav',upsert:true});if(up.error)throw up.error;c.audio_path=path;return path}
async function saveProject(){if(recording)return msg('Arrête d’abord l’enregistrement');if(!clips.length)return msg('Le projet est vide');if(!currentProjectName){let n=prompt('Nom du projet','Mon montage');if(!n?.trim())return;currentProjectName=n.trim()}let id=currentProjectId||crypto.randomUUID();msg('Enregistrement du projet…');try{for(let c of clips)await ensureProjectAudio(c,id);let data=serializableProject();if(currentProjectId){let r=await dbClient.from('studio_projects').update({name:currentProjectName,project_data:data,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error}else{let r=await dbClient.from('studio_projects').insert({id,name:currentProjectName,project_data:data});if(r.error)throw r.error;currentProjectId=id}msg('Projet enregistré ✓')}catch(e){console.error(e);msg('Échec de l’enregistrement')}}
async function loadProjectRow(p){if(recording)return;stopPlay();msg('Ouverture du projet…');try{let d=p.project_data||{},loaded=[];for(let c of d.clips||[]){if(!c.audio_path)continue;let r=await dbClient.storage.from('studio-projects').download(c.audio_path);if(r.error)throw r.error;let b=await ctx.decodeAudioData(await r.data.arrayBuffer());loaded.push({...c,buffer:b})}clips=loaded;tracks=d.tracks?.length?d.tracks:[{id:'voice',name:'🎙️ VOIX 1',type:'voice',gain:1,muted:false,color:'#785cff'}];cursor=d.cursor||0;zoom=d.zoom||1;currentProjectId=p.id;currentProjectName=p.name;selected=null;undo=[];redo=[];$('#project-panel').classList.remove('show');render();msg('Projet ouvert ✓')}catch(e){console.error(e);msg('Impossible d’ouvrir ce projet')}}
async function showProjects(){let panel=$('#project-panel');panel.classList.toggle('show');if(!panel.classList.contains('show'))return;panel.innerHTML='Chargement…';let r=await dbClient.from('studio_projects').select('*').order('updated_at',{ascending:false});if(r.error){panel.textContent='Impossible de charger les projets';return}panel.innerHTML='<b>📂 MES PROJETS</b>';if(!r.data?.length){panel.innerHTML+='<div class="libempty">Aucun projet enregistré</div>';return}r.data.forEach(p=>{let row=document.createElement('div');row.className='projectrow';let info=document.createElement('div'),open=document.createElement('button'),del=document.createElement('button');info.innerHTML='<b></b><small></small>';info.querySelector('b').textContent=p.name;info.querySelector('small').textContent=new Date(p.updated_at).toLocaleString('fr-FR');open.textContent='OUVRIR';open.onclick=()=>loadProjectRow(p);del.textContent='🗑';del.onclick=async()=>{if(!confirm('Supprimer ce projet ?'))return;let paths=(p.project_data?.clips||[]).map(c=>c.audio_path).filter(Boolean);if(paths.length)await dbClient.storage.from('studio-projects').remove(paths);await dbClient.from('studio_projects').delete().eq('id',p.id);if(currentProjectId===p.id){currentProjectId=null;currentProjectName=''}showProjects();showProjects()};row.append(info,open,del);panel.appendChild(row)})}
function downloadProjectCopy(){if(!clips.length)return msg('Le projet est vide');let d=serializableProject();d.clips=d.clips.map(c=>({...c,audio_path:null}));let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(currentProjectName||'projet-studio').replace(/[^a-z0-9_-]+/gi,'-')+'.foreststudio';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('Copie du projet téléchargée ✓')}
$('#save-project').onclick=saveProject;$('#projects').onclick=showProjects;$('#download-project').onclick=downloadProjectCopy;
let exportDiagnosticStep='repos',exportBusy=false;
function exportDiag(step){exportDiagnosticStep=step;let e=$('#toast');e.textContent='EXPORT — '+step;e.style.display='block';clearTimeout(e.t)}
function setExportBusy(b){exportBusy=b;$('#export').disabled=b;$('#export-selection').disabled=b}
async function inspectWavBlob(blob){if(!(blob instanceof Blob)||blob.size<44)throw Error('WAV trop court');let h=await blob.slice(0,44).arrayBuffer(),v=new DataView(h),tag=(o,n)=>String.fromCharCode(...new Uint8Array(h,o,n));if(tag(0,4)!=='RIFF'||tag(8,4)!=='WAVE'||tag(12,4)!=='fmt '||tag(36,4)!=='data')throw Error('header WAV invalide');let channels=v.getUint16(22,true),sampleRate=v.getUint32(24,true),bits=v.getUint16(34,true),dataSize=v.getUint32(40,true),bytesPerFrame=channels*bits/8;if(!channels||!sampleRate||bits!==16||!Number.isInteger(bytesPerFrame)||dataSize%bytesPerFrame!==0||44+dataSize!==blob.size)throw Error('structure WAV incohérente');let frames=dataSize/bytesPerFrame;return{headerSize:44,channels,sampleRate,bits,dataSize,frames,duration:frames/sampleRate}}
async function exportRange(start,end,label='montage-son',diagnostic=false){if(exportBusy)return;if(!clips.length)return msg('Rien à exporter');let requestedStart=start,requestedEnd=end,requestedDuration=end-start,filename=diagnostic?'selection-'+selectionSeconds(start)+'-'+selectionSeconds(end)+'.wav':label+'.wav';if(diagnostic)selectionDiagnostic('EXPORT SÉLECTION DEMANDÉ\ndébut = '+selectionSeconds(start)+' s\nfin = '+selectionSeconds(end)+' s\ndurée = '+selectionSeconds(requestedDuration)+' s\nfichier = '+filename);let audible=clips.some(c=>{let t=tracks.find(x=>x.id===c.track);return !c.muted&&!t?.muted&&c.start+c.len>start&&c.start<end});if(!audible)return msg('Aucun son dans cette partie');setExportBusy(true);try{exportDiag('préparation');await StudioExportCore.yieldToEventLoop();let xs=clips.map(c=>{let t=tracks.find(x=>x.id===c.track);return{...c,trackMuted:!!t?.muted,trackGain:t?.gain??1}}),plan=StudioExportCore.validatePlan(xs,start,end);if(diagnostic)selectionDiagnostic('PLAN EXPORT\ndébut transmis = '+selectionSeconds(plan.start)+' s\nfin transmise = '+selectionSeconds(plan.end)+' s\nframes = '+plan.frames+'\ndurée = '+selectionSeconds(plan.frames/plan.sampleRate)+' s\nfichier = '+filename);exportDiag('préparation · '+plan.duration.toFixed(1)+' s · '+plan.frames+' frames · '+(plan.estimatedPeakBytes/1048576).toFixed(1)+' Mo max');await StudioExportCore.yieldToEventLoop();let mixed=await StudioExportCore.mixPcmCooperative(xs,plan,(n,total)=>exportDiag('mixage '+Math.round(n/total*100)+' %'));exportDiag('encodage 0 %');await StudioExportCore.yieldToEventLoop();let blob=await StudioExportCore.encodeWavCooperative(mixed.left,mixed.right,plan.sampleRate,(n,total)=>exportDiag('encodage '+Math.round(n/total*100)+' %'));let wavInfo=await inspectWavBlob(blob),expectedFrames=plan.frames;if(wavInfo.frames!==expectedFrames||Math.abs(wavInfo.duration-requestedDuration)>1/plan.sampleRate+1e-9){let detail='ERREUR EXPORT — WAV DIFFÉRENT DE LA SÉLECTION\ndurée sélection = '+selectionSeconds(requestedDuration)+' s\ndurée WAV = '+selectionSeconds(wavInfo.duration)+' s\nframes attendues = '+expectedFrames+'\nframes obtenues = '+wavInfo.frames;selectionDiagnostic(detail);throw Error('durée WAV incohérente')}if(diagnostic)selectionDiagnostic('FICHIER CRÉÉ\n'+filename+'\ntaille = '+blob.size+' octets\nheader = '+wavInfo.headerSize+' octets\ncanaux = '+wavInfo.channels+'\nsample rate = '+wavInfo.sampleRate+' Hz\ndata = '+wavInfo.dataSize+' octets\nframes = '+wavInfo.frames+'\ndurée WAV = '+selectionSeconds(wavInfo.duration)+' s');exportDiag('préparation fichier · '+(blob.size/1048576).toFixed(2)+' Mo');await StudioExportCore.yieldToEventLoop();let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);if(diagnostic)selectionDiagnostic('TÉLÉCHARGEMENT DÉCLENCHÉ\n'+filename+'\nsélection '+selectionSeconds(requestedStart)+' → '+selectionSeconds(requestedEnd)+' s\nframes WAV = '+wavInfo.frames+'\ndurée WAV = '+selectionSeconds(wavInfo.duration)+' s\ntaille = '+blob.size+' octets');msg('EXPORT TERMINÉ · '+(blob.size/1048576).toFixed(2)+' Mo')}catch(e){console.error('EXPORT STUDIO',exportDiagnosticStep,e);if(diagnostic&&!$('#selection-diagnostic').textContent.startsWith('ERREUR EXPORT'))selectionDiagnostic('ERREUR EXPORT — '+exportDiagnosticStep+' — '+(e?.message||String(e)));msg('ERREUR EXPORT — '+exportDiagnosticStep+' — '+(e?.message||String(e)))}finally{setExportBusy(false)}}
$('#export').onclick=()=>{let end=Math.max(0,...clips.map(c=>c.start+c.len));exportRange(0,end,'montage-son')};
$('#export-selection').onclick=()=>{if(selectionStart===null||selectionEnd===null){selectionDiagnostic('SÉLECTION INVALIDE — début et fin requis');return msg('Choisis un début et une fin')}if(selectionEnd<=selectionStart){selectionDiagnostic('SÉLECTION INVALIDE — DÉBUT = '+selectionSeconds(selectionStart)+' s, FIN = '+selectionSeconds(selectionEnd)+' s');return msg('La fin doit être après le début')}let start=selectionStart,end=selectionEnd;exportRange(start,end,'selection-son',true)};render();restoreLocalAutosave();
</script></body></html>
