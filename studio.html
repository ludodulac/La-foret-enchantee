function clickBeat(at){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=1000;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.18,at+.002);g.gain.exponentialRampToValueAtTime(.0001,at+.045);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+.05)}function startMetro(){stopMetro();if(!metroOn)return;metroNext=ctx.currentTime+.05;metroTimer=setInterval(()=>{while(metroNext<ctx.currentTime+.12){clickBeat(metroNext);metroNext+=60/bpm}},25)}function stopMetro(){clearInterval(metroTimer);metroTimer=null}function updateMetro(){let b=$('#metro');b.textContent='🎵 CLIC : '+(metroOn?'OUI':'NON');b.classList.toggle('on',metroOn);$('#bpm').textContent=bpm+' BPM'}$('#metro').onclick=()=>{metroOn=!metroOn;updateMetro();if(playing||recording){if(metroOn)startMetro();else stopMetro()}};$('#bpm-minus').onclick=()=>{bpm=Math.max(30,bpm-5);updateMetro();if(metroTimer)startMetro()};$('#bpm-plus').onclick=()=>{bpm=Math.min(240,bpm+5);updateMetro();if(metroTimer)startMetro()};updateMetro();

function play(from=cursor,monitor=false){stopPlay();ctx.resume();let now=ctx.currentTime;sources=[];clips.forEach(c=>{let t=tracks.find(x=>x.id===c.track);if(c.muted||t?.muted)return;let off=Math.max(0,from-c.start),remain=c.len-off;if(remain<=0)return;let s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=c.buffer;g.gain.value=c.gain*(t?.gain??1);s.connect(g).connect(ctx.destination);s.start(now+Math.max(0,c.start-from),c.trim+off,remain);sources.push(s)});playing=true;if(metroOn)startMetro();t0=performance.now()-from*1000;tick=setInterval(()=>{let t=(performance.now()-t0)/1000;if(recording){let oldD=projectDuration();liveDuration=Math.max(liveDuration,t+5);if(liveRec)liveRec.len=Math.max(.03,t-liveRec.start);let newD=projectDuration();if(newD!==oldD)render();let e=$('#liveclip');if(e&&liveRec){e.style.left=(liveRec.start*pixelsPerSecond())+'px';e.style.width=(liveRec.len*pixelsPerSecond())+'px'}setCursor(t,true);return}if(t>=projectDuration()){cursor=projectDuration();stopPlay();return}setCursor(t,true)},60);if(!monitor)$('#play').textContent='❚❚'}
$('#record').onclick=record;$('#play').onclick=()=>playing?stopPlay():play();$('#back').onclick=()=>{if(playing)stopPlay();setCursor(cursor-5,true)};$('#forward').onclick=()=>{if(playing)stopPlay();setCursor(cursor+5,true)};function zoomAt(f){let tl=$('#timeline'),oldPps=pixelsPerSecond(),screenX=cursor*oldPps-tl.scrollLeft;zoom=Math.max(1,Math.min(20,zoom*f));render();requestAnimationFrame(()=>{let newX=cursor*pixelsPerSecond();tl.scrollLeft=Math.max(0,newX-screenX)})}$('#plus').onclick=()=>zoomAt(1.6);$('#minus').onclick=()=>zoomAt(1/1.6);
$('#undo').onclick=()=>{if(!undo.length)return;redo.push(snapshot());restore(undo.pop())};$('#redo').onclick=()=>{if(!redo.length)return;undo.push(snapshot());restore(redo.pop())};
$('#cut').onclick=()=>{if(!selected)return;let rel=cursor-selected.start;if(rel<=.05||rel>=selected.len-.05)return msg('Place le curseur à l’intérieur du morceau');checkpoint();let right={...selected,id:crypto.randomUUID(),start:cursor,trim:selected.trim+rel,len:selected.len-rel};selected.len=rel;clips.push(right);selected=right;render();msg('Morceau coupé ✓')};$('#duplicate').onclick=()=>{if(!selected)return;checkpoint();let c={...selected,id:crypto.randomUUID(),start:selected.start+selected.len+.1};clips.push(c);selected=c;render()};$('#del').onclick=()=>{if(!selected)return;checkpoint();clips=clips.filter(c=>c!==selected);selected=null;$('#editor').classList.remove('show');render()};$('#clipmute').onclick=()=>{if(!selected)return;checkpoint();selected.muted=!selected.muted;$('#clipmute').textContent=selected.muted?'🔇 RÉACTIVER':'🔊 MUET';render();msg(selected.muted?'Morceau coupé du son':'Morceau réactivé')};let volStart=null;$('#clipvol').onpointerdown=()=>{volStart=snapshot()};$('#clipvol').oninput=e=>{if(selected)selected.gain=e.target.value/100};$('#clipvol').onchange=()=>{if(volStart){undo.push(volStart);redo=[];volStart=null;buttons()}};
function wav(ab){let n=ab.length,ch=ab.numberOfChannels,sr=ab.sampleRate,b=new ArrayBuffer(44+n*ch*2),v=new DataView(b),p=0,str=s=>{for(let x of s)v.setUint8(p++,x.charCodeAt(0))},u16=x=>{v.setUint16(p,x,true);p+=2},u32=x=>{v.setUint32(p,x,true);p+=4};str('RIFF');u32(36+n*ch*2);str('WAVEfmt ');u32(16);u16(1);u16(ch);u32(sr);u32(sr*ch*2);u16(ch*2);u16(16);str('data');u32(n*ch*2);for(let i=0;i<n;i++)for(let c=0;c<ch;c++){let x=Math.max(-1,Math.min(1,ab.getChannelData(c)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([b],{type:'audio/wav'})}

let librarySounds=[],libraryPreview=null,libraryPreviewButton=null;
function cleanFrenchName(name){return name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim()}
async function sha256Blob(blob){let b=await blob.arrayBuffer(),h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function backfillLibraryHashes(items){for(let s of items.filter(x=>!x.content_sha256)){let {data,error}=await dbClient.storage.from('studio-sounds').download(s.storage_path);if(error)continue;let hash=await sha256Blob(data),same=items.find(x=>x.id!==s.id&&x.content_sha256===hash);if(same)continue;let u=await dbClient.from('studio_sound_library').update({content_sha256:hash}).eq('id',s.id);if(!u.error)s.content_sha256=hash}}
function safeStorageName(name){let ext=(name.match(/\.[^.]+$/)||[''])[0].toLowerCase();return crypto.randomUUID()+ext}
async function loadLibrary(){let box=$('#library-list');box.innerHTML='<div class="libempty">Chargement…</div>';let {data,error}=await dbClient.from('studio_sound_library').select('*').order('name_fr');if(error){box.innerHTML='<div class="libempty">Bibliothèque indisponible</div>';return}librarySounds=(data||[]).sort((a,b)=>a.name_fr.localeCompare(b.name_fr,'fr',{sensitivity:'base'}));await backfillLibraryHashes(librarySounds);renderLibrary()}
function renderLibrary(){let q=$('#library-search').value.trim().toLowerCase(),arr=librarySounds.filter(s=>!q||[s.name_fr,s.original_name,s.category,...(s.keywords||[])].join(' ').toLowerCase().includes(q)),box=$('#library-list');if(!arr.length){box.innerHTML='<div class="libempty">Aucun son trouvé</div>';return}box.innerHTML='';arr.forEach(s=>{let row=document.createElement('div');row.className='libitem';row.innerHTML='<div class="libname"><b></b><small></small></div><button data-preview title="Écouter">▶</button><button data-rename title="Renommer">✎</button><button data-add title="Ajouter au montage">＋</button>';row.querySelector('b').textContent=s.name_fr;row.querySelector('small').textContent=s.category;row.querySelector('[data-preview]').onclick=async e=>{let btn=e.currentTarget;if(libraryPreview){libraryPreview.pause();libraryPreview.currentTime=0;if(libraryPreviewButton)libraryPreviewButton.textContent='▶';if(libraryPreviewButton===btn){libraryPreview=null;libraryPreviewButton=null;return}}btn.textContent='…';let {data,error}=await dbClient.storage.from('studio-sounds').download(s.storage_path);if(error){btn.textContent='▶';return msg('Impossible d’écouter ce son')}let url=URL.createObjectURL(data),a=new Audio(url);libraryPreview=a;libraryPreviewButton=btn;btn.textContent='■';a.onended=()=>{btn.textContent='▶';URL.revokeObjectURL(url);if(libraryPreview===a){libraryPreview=null;libraryPreviewButton=null}};a.onerror=()=>{btn.textContent='▶';URL.revokeObjectURL(url);msg('Impossible de lire ce son')};a.play().catch(()=>{btn.textContent='▶';URL.revokeObjectURL(url);msg('Lecture impossible')})};row.querySelector('[data-rename]').onclick=async()=>{let n=prompt('Nom français du son',s.name_fr);if(!n?.trim())return;let {error}=await dbClient.from('studio_sound_library').update({name_fr:n.trim()}).eq('id',s.id);if(error)return msg('Impossible de renommer');s.name_fr=n.trim();renderLibrary()};row.querySelector('[data-add]').onclick=()=>addLibrarySound(s);box.appendChild(row)})}
async function addLibrarySound(s){let {data,error}=await dbClient.storage.from('studio-sounds').download(s.storage_path);if(error)return msg('Impossible de charger ce son');try{let b=await ctx.decodeAudioData(await data.arrayBuffer());let soundTracks=tracks.filter(t=>t.type==='sound'),target=soundTracks[soundTracks.length-1];if(!target){if(tracks.length>=4)return msg('Ajoute une piste son');target=addTrack('sound')}checkpoint();clips.push({id:crypto.randomUUID(),track:target.id,name:s.name_fr,buffer:b,start:cursor,trim:0,len:b.duration,gain:1,muted:false});render();msg('Son ajouté ✓')}catch{msg('Format audio non reconnu')}}
$('#import-library').onclick=()=>$('#library-files').click();$('#refresh-library').onclick=loadLibrary;$('#library-search').oninput=renderLibrary;
$('#library-files').onchange=async e=>{let files=[...e.target.files];if(!files.length)return;msg('Import de '+files.length+' son'+(files.length>1?'s':'')+'…');let ok=0;let duplicates=0;for(let f of files){let hash=await sha256Blob(f),existing=librarySounds.find(s=>s.content_sha256===hash);if(existing){duplicates++;continue}let path='imports/'+safeStorageName(f.name),name=cleanFrenchName(f.name);let up=await dbClient.storage.from('studio-sounds').upload(path,f,{contentType:f.type||undefined,upsert:false});if(up.error)continue;let ins=await dbClient.from('studio_sound_library').insert({name_fr:name,original_name:f.name,storage_path:path,category:'À classer',mime_type:f.type||null,size_bytes:f.size,content_sha256:hash});if(ins.error){await dbClient.storage.from('studio-sounds').remove([path]);if(ins.error.code==='23505')duplicates++;continue}librarySounds.push({content_sha256:hash});ok++}e.target.value='';await loadLibrary();msg(ok+' importé'+(ok>1?'s':'')+(duplicates?' · '+duplicates+' doublon'+(duplicates>1?'s':'')+' ignoré'+(duplicates>1?'s':''):'')+' ✓')};
loadLibrary();
$('#export').onclick=async()=>{if(!clips.length)return msg('Rien à exporter');msg('Préparation…');let sr=44100,d=projectDuration(),o=new OfflineAudioContext(2,Math.ceil(d*sr),sr);clips.forEach(c=>{let t=tracks.find(x=>x.id===c.track);if(c.muted||t?.muted)return;let s=o.createBufferSource(),g=o.createGain();s.buffer=c.buffer;g.gain.value=c.gain*(t?.gain??1);s.connect(g).connect(o.destination);s.start(c.start,c.trim,c.len)});let out=await o.startRendering(),a=document.createElement('a');a.href=URL.createObjectURL(wav(out));a.download='montage-son.wav';a.click();msg('Montage exporté ✓')};render();
</script></body></html>
